<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector - AI Powered Emotion & Gender Detection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: bold;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: #94a3b8;
            font-size: 1.2rem;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 12px;
            padding: 0.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .tab {
            padding: 1rem 2rem;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
        }

        #videoElement {
            width: 100%;
            border-radius: 12px;
            background: #000;
        }

        .face-guide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 250px;
            border: 2px solid rgba(59, 130, 246, 0.5);
            border-radius: 20%;
            pointer-events: none;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 1rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .upload-area {
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .upload-area:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .upload-area.dragover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.2);
        }

        .result {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            margin-top: 1rem;
            display: none;
        }

        .result.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        .emotion-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-weight: 600;
            margin-right: 0.5rem;
            margin-bottom: 0.5rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #3b82f6;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        .detection-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
        }

        .confidence-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #3b82f6);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .camera-preview {
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            margin: 0 auto 1rem;
            display: block;
        }

        .analysis-notes {
            background: rgba(59, 130, 246, 0.1);
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            border-radius: 0 8px 8px 0;
            margin-top: 1rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .tabs {
                flex-direction: column;
            }
            
            .tab {
                padding: 0.75rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Emotion Detector</h1>
            <p>AI Powered Emotion & Gender Detection</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('live')">Live Detection</button>
            <button class="tab" onclick="switchTab('camera')">Camera Capture</button>
            <button class="tab" onclick="switchTab('upload')">Photo Upload</button>
        </div>

        <!-- Live Video Detection Tab -->
        <div id="live-tab" class="tab-content active">
            <div class="card">
                <h2 style="text-align: center; margin-bottom: 1.5rem;">Real-time Emotion Detection</h2>
                <div class="video-container">
                    <video id="videoElement" autoplay playsinline></video>
                    <div class="face-guide"></div>
                </div>
                <div class="controls">
                    <button class="btn" onclick="startCamera()" id="startBtn">Start Camera</button>
                    <button class="btn btn-secondary" onclick="stopCamera()" id="stopBtn" disabled>Stop Camera</button>
                    <button class="btn" onclick="captureFromLive()">Capture & Analyze</button>
                </div>
            </div>
        </div>

        <!-- Camera Capture Tab -->
        <div id="camera-tab" class="tab-content">
            <div class="card">
                <h2 style="text-align: center; margin-bottom: 1.5rem;">Camera Capture</h2>
                <div class="video-container">
                    <video id="cameraElement" autoplay playsinline></video>
                    <div class="face-guide"></div>
                </div>
                <div class="controls">
                    <button class="btn" onclick="startCameraCapture()" id="startCaptureBtn">Start Camera</button>
                    <button class="btn" onclick="capturePhoto()">Capture Photo</button>
                </div>
                <canvas id="captureCanvas" style="display: none;"></canvas>
                <img id="capturePreview" class="camera-preview" style="display: none;">
            </div>
        </div>

        <!-- Photo Upload Tab -->
        <div id="upload-tab" class="tab-content">
            <div class="card">
                <h2 style="text-align: center; margin-bottom: 1.5rem;">Upload Photo</h2>
                <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size: 4rem; margin-bottom: 1rem;">??</div>
                    <h3>Click to upload or drag and drop</h3>
                    <p style="color: #94a3b8; margin-top: 0.5rem;">Supports JPG, PNG, JPEG</p>
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileUpload(this.files[0])">
                <img id="uploadPreview" class="camera-preview" style="display: none;">
            </div>
        </div>

        <!-- Analysis Results -->
        <div class="result" id="result">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Analysis Results</h2>
            <div id="resultContent"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Analyzing with AI...</p>
        </div>

        <div style="text-align: center; color: #94a3b8; margin-top: 3rem;">
            <p>Powered by AI Backend: <strong>https://emote-vn4b7.vercel.app</strong></p>
        </div>
    </div>

    <script>
        let currentStream = null;
        let currentTab = 'live';

        // Tab switching
        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update tabs
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            
            event.target.classList.add('active');
            document.getElementById(tabName + '-tab').classList.add('active');
            
            // Stop any running camera when switching tabs
            stopCamera();
        }

        // Live Video Detection Functions
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' },
                    audio: false 
                });
                
                const video = document.getElementById('videoElement');
                video.srcObject = stream;
                currentStream = stream;
                
                document.getElementById('startBtn').disabled = true;
                document.getElementById('stopBtn').disabled = false;
                
            } catch (err) {
                alert('Cannot access camera. Please allow camera permissions.');
                console.error('Camera error:', err);
            }
        }

        function stopCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
                
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                
                const video = document.getElementById('videoElement');
                video.srcObject = null;
            }
        }

        async function captureFromLive() {
            const video = document.getElementById('videoElement');
            if (!video.srcObject) {
                alert('Please start the camera first');
                return;
            }

            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            canvas.toBlob(async (blob) => {
                await analyzeImage(blob, 'live-capture');
            }, 'image/jpeg', 0.9);
        }

        // Camera Capture Functions
        async function startCameraCapture() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user' },
                    audio: false 
                });
                
                const video = document.getElementById('cameraElement');
                video.srcObject = stream;
                currentStream = stream;
                
            } catch (err) {
                alert('Cannot access camera. Please allow camera permissions.');
                console.error('Camera error:', err);
            }
        }

        function capturePhoto() {
            const video = document.getElementById('cameraElement');
            const canvas = document.getElementById('captureCanvas');
            const preview = document.getElementById('capturePreview');
            
            if (!video.srcObject) {
                alert('Please start the camera first');
                return;
            }

            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            preview.src = canvas.toDataURL('image/jpeg');
            preview.style.display = 'block';
            
            canvas.toBlob(async (blob) => {
                await analyzeImage(blob, 'camera-capture');
            }, 'image/jpeg', 0.9);
        }

        // File Upload Functions
        function handleFileUpload(file) {
            if (!file) return;
            
            if (!file.type.startsWith('image/')) {
                alert('Please upload an image file');
                return;
            }

            const preview = document.getElementById('uploadPreview');
            const reader = new FileReader();
            
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            
            reader.readAsDataURL(file);
            
            analyzeImage(file, 'file-upload');
        }

        // Drag and drop functionality
        const uploadArea = document.getElementById('uploadArea');
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) handleFileUpload(file);
        });

        // Analysis Function
        async function analyzeImage(blob, source) {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');

            loading.style.display = 'block';
            result.classList.remove('active');

            try {
                const formData = new FormData();
                formData.append('image', blob, `face-${source}-${Date.now()}.jpg`);

                const response = await fetch('https://emote-vn4b7.vercel.app/api/analyze-face', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                loading.style.display = 'none';
                result.classList.add('active');

                if (data.success) {
                    const emotionColors = {
                        happy: { bg: 'linear-gradient(135deg, #10b981, #059669)', emoji: '??' },
                        sad: { bg: 'linear-gradient(135deg, #3b82f6, #1d4ed8)', emoji: '??' },
                        angry: { bg: 'linear-gradient(135deg, #ef4444, #dc2626)', emoji: '??' },
                        surprised: { bg: 'linear-gradient(135deg, #f59e0b, #d97706)', emoji: '??' },
                        neutral: { bg: 'linear-gradient(135deg, #6b7280, #4b5563)', emoji: '??' },
                        fearful: { bg: 'linear-gradient(135deg, #8b5cf6, #7c3aed)', emoji: '??' },
                        disgusted: { bg: 'linear-gradient(135deg, #ec4899, #db2777)', emoji: '??' }
                    };

                    const emotion = data.emotion || 'neutral';
                    const color = emotionColors[emotion] || emotionColors.neutral;

                    resultContent.innerHTML = `
                        <div style="text-align: center; margin-bottom: 2rem;">
                            <div class="emotion-badge" style="background: ${color.bg}; font-size: 1.2rem;">
                                ${color.emoji} ${emotion.charAt(0).toUpperCase() + emotion.slice(1)}
                            </div>
                        </div>
                        
                        <div class="detection-info">
                            <div class="info-card">
                                <h3>Emotion Confidence</h3>
                                <div style="font-size: 2rem; font-weight: bold; margin: 0.5rem 0;">
                                    ${Math.round(data.emotion_confidence || 0)}%
                                </div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style="width: ${data.emotion_confidence || 0}%"></div>
                                </div>
                            </div>
                            
                            <div class="info-card">
                                <h3>Gender Detection</h3>
                                <div style="font-size: 1.5rem; font-weight: bold; margin: 0.5rem 0;">
                                    ${data.gender ? data.gender.charAt(0).toUpperCase() + data.gender.slice(1) : 'Unknown'}
                                </div>
                                <div style="color: #94a3b8;">
                                    Confidence: ${Math.round(data.gender_confidence || 0)}%
                                </div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" style="width: ${data.gender_confidence || 0}%"></div>
                                </div>
                            </div>
                        </div>
                        
                        ${data.analysis_notes ? `
                            <div class="analysis-notes">
                                <strong>AI Analysis:</strong> ${data.analysis_notes}
                            </div>
                        ` : ''}
                    `;
                } else {
                    resultContent.innerHTML = `
                        <div style="text-align: center; color: #ef4444;">
                            <h3>Analysis Failed</h3>
                            <p>${data.error || 'Unknown error occurred'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                loading.style.display = 'none';
                result.classList.add('active');
                resultContent.innerHTML = `
                    <div style="text-align: center; color: #ef4444;">
                        <h3>Connection Error</h3>
                        <p>Failed to connect to AI backend. Please try again.</p>
                    </div>
                `;
                console.error('Analysis error:', error);
            }
        }

        // Stop camera when leaving page
        window.addEventListener('beforeunload', stopCamera);
    </script>
</body>
</html>
