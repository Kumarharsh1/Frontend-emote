<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector - AI Powered Emotion & Gender Detection</title>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: white;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .upload-area {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .result {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            margin-top: 1rem;
            display: none;
        }
        input[type="file"] {
            margin-bottom: 1rem;
            padding: 0.5rem;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: white;
            width: 100%;
        }
        .loading {
            text-align: center;
            padding: 2rem;
            display: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #3b82f6;
            border-top: 3px solid transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Emotion Detector</h1>
            <p>AI Powered Emotion & Gender Detection</p>
        </div>

        <div class="upload-area">
            <h2>Upload Image</h2>
            <input type="file" id="imageInput" accept="image/*">
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing image...</p>
            </div>

            <div class="result" id="result">
                <h3>Analysis Result</h3>
                <div id="resultContent"></div>
            </div>
        </div>

        <div style="text-align: center; color: #94a3b8;">
            <p>Backend: <strong>https://emote-vn4b7.vercel.app</strong></p>
        </div>
    </div>

    <script>
        document.getElementById('imageInput').addEventListener('change', async function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');

            loading.style.display = 'block';
            result.style.display = 'none';

            try {
                const formData = new FormData();
                formData.append('image', file);

                const response = await fetch('https://emote-vn4b7.vercel.app/api/analyze-face', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                loading.style.display = 'none';
                result.style.display = 'block';

                if (data.success) {
                    resultContent.innerHTML = `
                        <p><strong>Emotion:</strong> ${data.emotion} (${Math.round(data.emotion_confidence)}%)</p>
                        <p><strong>Gender:</strong> ${data.gender} (${Math.round(data.gender_confidence)}%)</p>
                        ${data.analysis_notes ? `<p style="margin-top: 1rem; color: #94a3b8;">${data.analysis_notes}</p>` : ''}
                    `;
                } else {
                    resultContent.innerHTML = `<p style="color: #ef4444;"><strong>Error:</strong> ${data.error}</p>`;
                }
            } catch (error) {
                loading.style.display = 'none';
                result.style.display = 'block';
                resultContent.innerHTML = `<p style="color: #ef4444;"><strong>Error:</strong> Failed to analyze image</p>`;
            }
        });
    </script>
</body>
</html>
